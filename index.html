    <script>
      // Tema e idioma guardados neste browser, aplicados antes do primeiro desenho (ver PreferencesContext).
      (function () {
        try {
          var theme = localStorage.getItem('tsheetgrt.theme');
          var dark = theme === 'dark' || ((theme === null || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (localStorage.getItem('tsheetgrt.locale') === 'en') document.documentElement.lang = 'en-GB';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
